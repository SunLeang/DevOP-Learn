- name: Create website directory
  file:
    path: "{{ website_path }}"
    state: directory
    mode: "0755"

- name: Check if Laravel project exists
  stat:
    path: "{{ website_path }}/.git"
  register: git_exists

- name: Remove directory if it exists but is not a git repo
  file:
    path: "{{ website_path }}"
    state: absent
  when: not git_exists.stat.exists

- name: Recreate website directory
  file:
    path: "{{ website_path }}"
    state: directory
    mode: "0755"
  when: not git_exists.stat.exists

- name: Clone Laravel project from GitHub
  git:
    repo: https://github.com/srengty/i4c-library-web.git
    dest: "{{ website_path }}"
    force: yes
  when: not git_exists.stat.exists

- name: Install Composer dependencies
  command: composer install --no-interaction --optimize-autoloader
  args:
    chdir: "{{ website_path }}"

- name: Install NPM dependencies
  command: npm install
  args:
    chdir: "{{ website_path }}"

- name: Build frontend assets
  command: npm run build
  args:
    chdir: "{{ website_path }}"
  ignore_errors: yes

- name: Set ownership of website directory to www-data
  file:
    path: "{{ website_path }}"
    state: directory
    recurse: yes
    owner: www-data
    group: www-data

- name: Set permissions on storage and bootstrap/cache directories
  file:
    path: "{{ item }}"
    mode: "0775"
    recurse: yes
  loop:
    - "{{ website_path }}/storage"
    - "{{ website_path }}/bootstrap/cache"

- name: Create .env file from .env.example
  copy:
    src: "{{ website_path }}/.env.example"
    dest: "{{ website_path }}/.env"
    remote_src: yes
    force: no

- name: Configure database in .env file
  lineinfile:
    path: "{{ website_path }}/.env"
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
  loop:
    - { regexp: "^DB_CONNECTION=", line: "DB_CONNECTION=mysql" }
    - { regexp: "^DB_HOST=", line: "DB_HOST=127.0.0.1" }
    - { regexp: "^DB_PORT=", line: "DB_PORT=3306" }
    - { regexp: "^DB_DATABASE=", line: "DB_DATABASE={{ db_name }}" }
    - {
        regexp: "^DB_USERNAME=",
        line: "DB_USERNAME={{ db_user | default(db_name + '_user') }}",
      }
    - {
        regexp: "^DB_PASSWORD=",
        line: "DB_PASSWORD={{ db_password | default('secure_password_123') }}",
      }

- name: Generate Laravel application key
  command: php {{ website_path }}/artisan key:generate --force
  args:
    chdir: "{{ website_path }}"

- name: Run Laravel migrations
  command: php {{ website_path }}/artisan migrate --force
  args:
    chdir: "{{ website_path }}"
  ignore_errors: yes

- name: Seed database (if seeders exist)
  command: php {{ website_path }}/artisan db:seed --force
  args:
    chdir: "{{ website_path }}"
  ignore_errors: yes

- name: Clear Laravel caches
  command: "{{ item }}"
  args:
    chdir: "{{ website_path }}"
  loop:
    - php artisan config:clear
    - php artisan cache:clear
    - php artisan route:clear
    - php artisan view:clear
  ignore_errors: yes

- name: Optimize Laravel for production
  command: "{{ item }}"
  args:
    chdir: "{{ website_path }}"
  loop:
    - php artisan config:cache
    - php artisan route:cache
    - php artisan view:cache
  ignore_errors: yes
  when: "'production' in website_path"
