- name: Setup Laravel staging and production websites
  hosts: child_node
  become: yes

  tasks:
    - include_tasks: tasks/setup_environment.yml

    - name: Setup staging website
      include_tasks: tasks/setup_website.yml
      vars:
        website_path: /var/www/html/staging
        db_name: staging_db
        db_user: staging_db_user
        db_password: secure_password_123
        server_name: i4gic2024.staging

    - name: Deploy nginx config for staging
      template:
        src: nginx.conf.j2
        dest: /etc/nginx/conf.d/i4gic2024.staging.conf
      vars:
        website_path: /var/www/html/staging
        server_name: i4gic2024.staging
      notify: Reload nginx

    - name: Setup production website
      include_tasks: tasks/setup_website.yml
      vars:
        website_path: /var/www/html/production
        db_name: prod_db
        db_user: prod_db_user
        db_password: secure_password_123
        server_name: i4gic2024.com

    - name: Deploy nginx config for production
      template:
        src: nginx.conf.j2
        dest: /etc/nginx/conf.d/i4gic2024.com.conf
      vars:
        website_path: /var/www/html/production
        server_name: i4gic2024.com
      notify: Reload nginx

  handlers:
    - name: Reload nginx
      ansible.builtin.shell: |
        service nginx reload || nginx -s reload
